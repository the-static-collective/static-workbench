name: "STACK² 026 — Portable P256 verification × LOADOUT OpenManus OBSERVE"
on:
  push:
    branches:
      - experiment/stack-squared-026-openmanus-portable-verification
  pull_request:
    paths:
      - "static_workbench/receipt_porter.py"
      - "static_workbench/openmanus_026.py"
      - "scripts/stack2-026-portable.mjs"
      - "tests/stack2-026-portable.test.mjs"
      - "static_workbench/app.py"
      - "static_workbench/web/receipt-verification*"
      - "static_workbench/web/receipt-floor.html"
      - "tests/*receipt_porter_025.py"
      - "tests/stack2-026-portable.test.mjs"
      - "tests/fixtures/fake_receipt_openmanus_026.py"
      - "docs/STACK-SQUARED-026.md"
      - ".github/workflows/stack2-026-openmanus-portable.yml"
permissions:
  contents: read
jobs:
  porter-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python + Node P256 portable, original 025 and authority negative tests
        run: |
          python3 -m py_compile static_workbench/receipt_porter.py static_workbench/openmanus_026.py
          node --check scripts/stack2-026-portable.mjs
          node --test tests/stack2-026-portable.test.mjs
          node --check static_workbench/web/receipt-verification-core.mjs
          node --check static_workbench/web/receipt-verification-ui.mjs
          node --test tests/receipt-verification-025.test.mjs
          node --test tests/receipt-floor-024.test.mjs
      - name: Workbench FastAPI host-only read and previous floor regression
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_receipt_porter_025.py tests/test_receipt_floor_024.py tests/test_stack_floor_019.py
      - name: Refuse HTTP write or browser selected native execution
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Ei "XMLHttpRequest|WebSocket|EventSource|localStorage|sessionStorage|subprocess|child_process|/api/execute|method:[ ]*'POST'" static_workbench/web/receipt-verification-ui.mjs static_workbench/web/receipt-verification-core.mjs
  source-pinned-native-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    needs: porter-contract
    steps:
      - name: Original Static Workbench porter
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact original GHoT AI recomposition
        uses: actions/checkout@v4
        with:
          repository: the-static-collective/GHoT
          ref: 6194d91ba83bad63606f6f6741723007227518f2
          path: ghot-source
          persist-credentials: false
      - name: Exact original CANNON STACK² 023 verifier
        uses: actions/checkout@v4
        with:
          repository: the-static-collective/CANNON
          ref: 2fab6e142f21f6213bbcf4e290030acfce756061
          path: cannon-source
          persist-credentials: false
      - name: Original pinned LOADOUT OpenManus BIND 001 adapter (not live provider)
        uses: actions/checkout@v4
        with:
          repository: the-static-collective/LOADOUT
          ref: dd5456d45946271e2d20d1dc6145b71576d2380b
          path: loadout-source
          persist-credentials: false
      - name: Exact original reLATTE R14
        uses: actions/checkout@v4
        with:
          repository: the-static-collective/reLATTE
          ref: dcc8cdca84c440aa4294134f020fb7095bf87f24
          path: relatte-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Original R14 dependencies
        run: cd relatte-source && npm install --ignore-scripts --no-audit --no-fund
      - name: Execute original signed Instrument Rack + R14 crossing into sovereign HOLD
        shell: bash
        run: |
          set -euo pipefail
          export GHOT_HOME="$RUNNER_TEMP/private-ghot"
          export GHOT_ADAPTER_MANIFESTS="$GITHUB_WORKSPACE/ghot-source/integrations/ai-recomposition-001/adapter-manifest.json"
          export PYTHONDONTWRITEBYTECODE=1
          printf '%s\n' 'Rosemary grows. Rosemary remembers. Sky is blue today.' > "$RUNNER_TEMP/input.txt"
          python3 ghot-source/ghot/ai_recomposition.py plan --mode profile --text-file "$RUNNER_TEMP/input.txt" --out "$RUNNER_TEMP/ghot-plan.json"
          python3 ghot-source/ghot/ai_recomposition.py run --text-file "$RUNNER_TEMP/input.txt" --plan-file "$RUNNER_TEMP/ghot-plan.json" --approve-exact-plan --dispatch-source operator-fixture-stack25 --out "$RUNNER_TEMP/private-ghot-report.json"
          (
            cd cannon-source
            node --experimental-strip-types scripts/stack-squared-023-ai.mjs run \
              examples/stack-squared-023-ai.plan.json \
              "$GITHUB_WORKSPACE/ghot-source" "$GITHUB_WORKSPACE/relatte-source" \
              "$RUNNER_TEMP/private-ghot-report.json" "$RUNNER_TEMP/private-crossing" \
              --approve-local-hold
          )
      - name: Real native porter re-verifies originals and emits bounded summary only
        shell: bash
        run: |
          set -euo pipefail
          python3 -m static_workbench.receipt_porter \
            --cannon-root "$GITHUB_WORKSPACE/cannon-source" \
            --ghot-root "$GITHUB_WORKSPACE/ghot-source" \
            --relatte-root "$GITHUB_WORKSPACE/relatte-source" \
            --original-report "$RUNNER_TEMP/private-ghot-report.json" \
            --crossing-output "$RUNNER_TEMP/private-crossing" \
            --state-dir "$RUNNER_TEMP/workbench-state"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from static_workbench.receipt_porter import latest_summary
          s=latest_summary(Path(os.environ["RUNNER_TEMP"])/"workbench-state")
          assert s["status"]=="LOCAL_NATIVE_SIGNED_CHAIN_VERIFIED"
          assert s["receiver_admitted"] is False
          assert s["browser_execution"] is False
          raw=json.dumps(s)
          assert "Rosemary grows" not in raw
          assert "private-ghot-report.json" not in raw
          assert "receiver-key.json" not in raw
          print("NATIVE_PORTER_025_REDacted_HOLD_VERIFIED")
          PY
      - name: Explicit isolated test-key portable issue and independent fingerprint verify
        shell: bash
        run: |
          set -euo pipefail
          openssl ecparam -name prime256v1 -genkey -noout -out "$RUNNER_TEMP/temporary-test-signing.pem"
          openssl pkey -in "$RUNNER_TEMP/temporary-test-signing.pem" -pubout -out "$RUNNER_TEMP/test-public-key.pem"
          expires="$(date -u -d '+48 hours' '+%Y-%m-%dT%H:%M:%SZ')"
          node scripts/stack2-026-portable.mjs issue \
            --state "$RUNNER_TEMP/workbench-state/receipt-porter/latest.json" \
            --private-key "$RUNNER_TEMP/temporary-test-signing.pem" \
            --expires-at "$expires" \
            --output "$RUNNER_TEMP/public-026.json" --approve-issue yes
          node scripts/stack2-026-portable.mjs fingerprint --public-key "$RUNNER_TEMP/test-public-key.pem" > "$RUNNER_TEMP/external-trust-anchor.txt"
          node scripts/stack2-026-portable.mjs verify \
            --bundle "$RUNNER_TEMP/public-026.json" \
            --trust-fingerprint "$(cat "$RUNNER_TEMP/external-trust-anchor.txt")"
      - name: Real LOADOUT OPENMANUS-BIND-001 OBSERVE membrane with isolated provider fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/agent-public-only"
          cp "$RUNNER_TEMP/public-026.json" "$RUNNER_TEMP/agent-public-only/public-026.json"
          python3 -m static_workbench.openmanus_026 \
            --loadout-root "$GITHUB_WORKSPACE/loadout-source" \
            --workspace "$RUNNER_TEMP/agent-public-only" \
            --verification-script "$GITHUB_WORKSPACE/scripts/stack2-026-portable.mjs" \
            --trust-fingerprint "$(cat "$RUNNER_TEMP/external-trust-anchor.txt")" \
            --provider-script "$GITHUB_WORKSPACE/tests/fixtures/fake_receipt_openmanus_026.py" \
            --approve-observe yes
          test "$(find "$RUNNER_TEMP/agent-public-only" -type f | wc -l)" -eq 1
      - name: Preserve only public signed certificate, never issuer key or private donor evidence
        uses: actions/upload-artifact@v4
        with:
          name: stack2-026-public-signed-demo-only
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/public-026.json
