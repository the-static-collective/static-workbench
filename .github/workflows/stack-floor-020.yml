name: "STACK² 020 — pinned GHoT 030 one-use ACT"
on:
  push:
    branches:
      - experiment/stack-squared-020-one-use-act
  pull_request:
    paths:
      - "static_workbench/stack_floor_native_020.py"
      - "static_workbench/config.py"
      - "static_workbench/app.py"
      - "static_workbench/web/stack-floor*"
      - "tests/test_stack_floor_020.py"
      - "tests/test_stack_floor_019.py"
      - "docs/STACK-SQUARED-020.md"
      - ".github/workflows/stack-floor-020.yml"
permissions:
  contents: read
jobs:
  native-one-use:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Workbench experimental branch
        uses: actions/checkout@v4
        with:
          path: workbench
          persist-credentials: false
      - name: Checkout original GHoT 030 pinned commit
        uses: actions/checkout@v4
        with:
          repository: the-static-collective/GHoT
          ref: b01758bee55d66d699160715ec377b45f7589707
          path: ghot
          persist-credentials: false
      - name: Checkout original planZ source pinned commit
        uses: actions/checkout@v4
        with:
          repository: the-static-collective/planZ
          ref: e8111fdb64c5587b33aece0fed639ed3d03375ac
          path: planz
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Workbench's test package only
        run: |
          python -m pip install -e './workbench[dev]'
          node --check workbench/static_workbench/web/stack-floor-act-020.mjs
          node --check workbench/static_workbench/web/stack-floor-ui.mjs
      - name: Run original GHoT one-use ACT, signed receipt and malicious replay refusals
        run: |
          export STACK2_020_GHOT_CHECKOUT="$PWD/ghot"
          export STACK2_020_PLANZ_CHECKOUT="$PWD/planz"
          cd workbench
          python -m pytest -q tests/test_stack_floor_020.py tests/test_stack_floor_019.py tests/test_ghot_shell.py
      - name: Verify no private key, remote activation, or shell selector added
        run: |
          test ! -e workbench/static_workbench/web/receiver-key.json
          test ! -e workbench/static_workbench/web/.env
          test ! -e workbench/static_workbench/web/ghot-identity.pem
