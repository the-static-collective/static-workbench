name: "STACK² 024 — living receipt floor"
on:
  push:
    branches:
      - experiment/stack-squared-024-living-receipt-floor
  pull_request:
    paths:
      - "static_workbench/web/receipt-floor*"
      - "static_workbench/web/stack-floor.html"
      - "static_workbench/web/index.html"
      - "static_workbench/web/app.js"
      - "static_workbench/app.py"
      - "tests/*receipt_floor_024*"
      - "tests/receipt-floor-024*"
      - "docs/STACK-SQUARED-024.md"
      - ".github/workflows/receipt-floor-024.yml"
permissions:
  contents: read
jobs:
  contract-and-route:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Local JS structural checks and strict public-witness mutation proofs
        run: |
          node --check static_workbench/web/receipt-floor-core.mjs
          node --check static_workbench/web/receipt-floor-ui.mjs
          node --check tests/receipt-floor-024.test.mjs
          node --test tests/receipt-floor-024.test.mjs
          node --test tests/stack-floor-019.test.mjs
      - name: Real FastAPI route, original Lego floor and host restrictions
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_receipt_floor_024.py tests/test_stack_floor_019.py tests/test_return_room_001.py tests/test_ghot_shell.py tests/test_ui.py
      - name: No browser network, credential ingestion, native executor or state API
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Ei "fetch\\(|XMLHttpRequest|WebSocket|EventSource|localStorage|sessionStorage|/api/receipt-floor|subprocess" static_workbench/web/receipt-floor-core.mjs static_workbench/web/receipt-floor-ui.mjs
          test ! -e static_workbench/web/receiver-key.json
          test ! -e static_workbench/web/.env
  chromium-receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    needs: contract-and-route
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install local Workbench and Chromium driver
        run: |
          python -m pip install -e '.[dev]'
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Real browser file picker, particular walk, consent and responsive screenshot
        env:
          STACK24_BROWSER_OUTPUT: /tmp/stack2-receipt-floor-images
        run: node tests/receipt-floor-024.browser.mjs
      - name: Preserve desktop and mobile visual witnesses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stack2-024-receipt-floor-chromium
          if-no-files-found: warn
          path: /tmp/stack2-receipt-floor-images/*.png
