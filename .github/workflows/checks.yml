name: Workbench checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install workbench and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Python tests
        run: python -m pytest -q
      - name: Browser JavaScript syntax
        run: |
          node --check static_workbench/web/app.js
          node --check static_workbench/web/creator-v02.js
          node --check static_workbench/web/maxhinal-dock.js
          node --check static_workbench/web/native-maxhinal.js
          node --check static_workbench/web/dogram-impact.js
