name: Workbench checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install workbench and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Python tests
        run: python -m pytest -q
      - name: Checkout pinned upstream Dogram for integration smoke
        uses: actions/checkout@v4
        with:
          repository: the-static-collective/Dogram
          ref: 0d2d848ef9a3c5243492bd28fa5c9a71423b2508
          path: .compat/Dogram
          persist-credentials: false
      - name: Actual Dogram integration smoke
        run: python scripts/smoke_dogram_impact.py
      - name: Actual public Dogram GRAFT witness smoke
        run: python scripts/smoke_graft_witness.py
      - name: Checkout pinned Static Live LIFESTREAM-001 for cross-repo smoke
        uses: actions/checkout@v4
        with:
          repository: the-static-collective/static-live
          ref: 2222cea82907cd06820810c75ac6e2e679c14037
          path: .compat/static-live
          persist-credentials: false
      - name: Actual LIFESTREAM-001 Node -> HOUSE -> Node roundtrip
        run: python scripts/smoke_lifestream_001.py
      - name: Checkout pinned Static Live LIFESTREAM-002 for synthetic cross-repo smoke
        uses: actions/checkout@v4
        with:
          repository: the-static-collective/static-live
          ref: 4d901b9593b3c299c1acd9c524fbc44ef3ecaa0f
          path: .compat/static-live-002
          persist-credentials: false
      - name: LIFESTREAM-002 marker to HOUSE inbox to verified Live return
        run: python scripts/smoke_lifestream_002.py
      - name: Checkout pinned reLATTE R14 transport
        uses: actions/checkout@v4
        with:
          repository: the-static-collective/reLATTE
          ref: 87006f3265103a8abe387d81597c58aeb39b0beb
          path: .compat/reLATTE
          persist-credentials: false
      - name: Install pinned reLATTE dependencies
        run: npm install --prefix .compat/reLATTE --no-package-lock --ignore-scripts
      - name: Checkout pinned GHoT creative body and field-reseed receiver
        uses: actions/checkout@v4
        with:
          repository: the-static-collective/GHoT
          ref: fa3a2d81b5cebc3532c9f7f6b950039186cc37c3
          path: .compat/GHoT
          persist-credentials: false
      - name: Actual Field reseed -> reLATTE -> GHoT HOLD/admission smoke
        run: python scripts/smoke_field_reseed_crossing.py
      - name: Checkout pinned Haunted Toaster creative adapter
        uses: actions/checkout@v4
        with:
          repository: the-static-collective/the-haunted-toaster
          ref: 3652c2a96b6b287cda316d1c92daadf7c7417eaf
          path: .compat/haunted-toaster
          persist-credentials: false
      - name: Checkout pinned Autodisco First Encounter
        uses: actions/checkout@v4
        with:
          repository: the-static-collective/The-AutodiscoV.20.-question-marks-
          ref: 7ad77a46debc7e8c05fc7434c9091f3e36870651
          path: .compat/autodisco
          persist-credentials: false
      - name: Checkout pinned Haunted Phonograph FIELD ANSWER
        uses: actions/checkout@v4
        with:
          repository: the-static-collective/the-haunted-phonography
          ref: 038b7101ecff781ee2ae17a22a1323ca28740d06
          path: .compat/haunted-phonograph
          persist-credentials: false
      - name: Checkout pinned Dogram signal + listener deltas
        uses: actions/checkout@v4
        with:
          repository: the-static-collective/Dogram
          ref: 551b5f9df18f17ec69b452ddcdff01718e0ff771
          path: .compat/Dogram
          persist-credentials: false
      - name: Actual House -> GHoT -> Toaster -> Autodisco creative smoke
        run: python scripts/smoke_doorhouse_creative.py
      - name: Browser JavaScript syntax
        run: |
          node --check static_workbench/web/lifestream.js
          node --check static_workbench/web/app.js
          node --check static_workbench/web/creator-v02.js
          node --check static_workbench/web/maxhinal-dock.js
          node --check static_workbench/web/native-maxhinal.js
          node --check static_workbench/web/dogram-impact.js
          node --check static_workbench/web/graft-witness.js
          node --check static_workbench/web/graft-round.js
          node --check static_workbench/web/graft-draft.js
          node --check static_workbench/web/groundkeeper.js
          node --check static_workbench/web/maddloop.js
          node --check static_workbench/web/machines.js
          node --check static_workbench/web/arg.js
          node --check static_workbench/web/arg-world.js
          node --check static_workbench/web/doorhouse.js
