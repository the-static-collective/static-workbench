name: Workbench checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install workbench and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Python tests
        run: python -m pytest -q
      - name: Checkout pinned upstream Dogram for integration smoke
        uses: actions/checkout@v4
        with:
          repository: the-static-collective/Dogram
          ref: 0d2d848ef9a3c5243492bd28fa5c9a71423b2508
          path: .compat/Dogram
          persist-credentials: false
      - name: Actual Dogram integration smoke
        run: python scripts/smoke_dogram_impact.py
      - name: Actual public Dogram GRAFT witness smoke
        run: python scripts/smoke_graft_witness.py
      - name: Checkout pinned Static Live LIFESTREAM-001 for cross-repo smoke
        uses: actions/checkout@v4
        with:
          repository: the-static-collective/static-live
          ref: 2222cea82907cd06820810c75ac6e2e679c14037
          path: .compat/static-live
          persist-credentials: false
      - name: Actual LIFESTREAM-001 Node -> HOUSE -> Node roundtrip
        run: python scripts/smoke_lifestream_001.py
      - name: Checkout pinned Static Live LIFESTREAM-002 for synthetic cross-repo smoke
        uses: actions/checkout@v4
        with:
          repository: the-static-collective/static-live
          ref: 4d901b9593b3c299c1acd9c524fbc44ef3ecaa0f
          path: .compat/static-live-002
          persist-credentials: false
      - name: LIFESTREAM-002 marker to HOUSE inbox to verified Live return
        run: python scripts/smoke_lifestream_002.py
      - name: Browser JavaScript syntax
        run: |
          node --check static_workbench/web/lifestream.js
          node --check static_workbench/web/app.js
          node --check static_workbench/web/creator-v02.js
          node --check static_workbench/web/creator-context-door.js
      - name: Creator context composition planner
        run: node tests/creator-context-door.cjs
          node --check static_workbench/web/maxhinal-dock.js
          node --check static_workbench/web/native-maxhinal.js
          node --check static_workbench/web/dogram-impact.js
          node --check static_workbench/web/graft-witness.js
          node --check static_workbench/web/graft-round.js
          node --check static_workbench/web/graft-draft.js
          node --check static_workbench/web/groundkeeper.js
          node --check static_workbench/web/branch-deck.js
          node --check static_workbench/web/attention.js
          node --check static_workbench/web/return-shelf.js
          node --check static_workbench/web/mirror.js
          node --check static_workbench/web/return-desk.js
          node --check static_workbench/web/rocket.js
          node --check static_workbench/web/composition-inspection.js
          node --check static_workbench/web/living-main.js
