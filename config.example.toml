# Static Workbench v0.2 — local-only example configuration
bind_host = "127.0.0.1"
port = 13700
state_dir = "~/.local/state/static-workbench"
max_repo_depth = 4
preview_bytes = 131072

# Optional bounded public GitHub branch/PR lookup from the Branch Deck.
# Uses no token, only an explicitly selected public Collective origin.
# github_remote_discovery = true

# Optional effectful Git worktree preparation (requires explicit two-step browser action).
# branch_worktrees_enabled = true

# Optional: explicit port chosen when starting the project-owned Static Broadcast console.
# Uncomment only after updating Static Live and starting its local service on this port.
# broadcast_port = 3008

# Point this at the parent directory that will contain your Static Collective repos.
[[roots]]
id = "static"
path = "~/static"

# Add more roots only when you intentionally want the Workbench to see them.
# [[roots]]
# id = "archive"
# path = "~/Documents/static-archive"
