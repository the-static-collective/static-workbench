[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "static-workbench"
version = "0.2.0"
description = "Local-first browser workbench for the Static Collective"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "psutil>=5.9,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[project.scripts]
static-workbench = "static_workbench.app:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["static_workbench*"]

[tool.setuptools.package-data]
static_workbench = ["web/*", "ark_manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
